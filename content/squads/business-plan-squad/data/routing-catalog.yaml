default:
  primary: business-plan-chief
  description: "Ponto de entrada padrão. Faz onboarding profundo e roteia."

# ═══════════════════════════════════════════════════════════════════
# Cross-squad routing
# ═══════════════════════════════════════════════════════════════════
external_routing:
  copy_for_pitch:
    keywords: ["pitch deck", "investor deck", "executive summary copy", "pitch para investidor"]
    route_to: copy-master-chief
    note: "Após BP fechado, /copy-master-chief para redação do pitch"

  brand_positioning:
    keywords: ["nome da empresa", "branding", "logo", "identidade visual", "posicionamento de marca"]
    route_to: brand-chief
    note: "Após estratégia competitiva definida"

  legal_review:
    keywords: ["estrutura societária", "holding", "SPV", "pacto de acionistas", "contrato"]
    route_to: legal-chief
    note: "Para revisão jurídica das estruturas propostas no BP"

  board_second_opinion:
    keywords: ["second opinion", "Ray Dalio", "Charlie Munger", "Buffett", "conselheiro"]
    route_to: board-chair
    note: "Para 'second opinion' do advisory-board"
