# Routing Catalog — business-plan-squad
# Mapeia palavras-chave da fala do usuário para especialistas específicos.
# Usado pelo /business-plan-chief para sugerir o especialista certo.

version: "1.0.0"
language_default: pt-BR

# ═══════════════════════════════════════════════════════════════════
# HIGHEST PRIORITY — Roteamento externo para capital-squad
# ═══════════════════════════════════════════════════════════════════
fundo_perdido_portugal:
  external_squad: capital-squad
  external_entry: capital-chief
  trigger_keywords:
    - "PRR"
    - "Portugal 2030"
    - "PT 2030"
    - "PT2030"
    - "Compete 2030"
    - "Banco de Fomento"
    - "Banco Português de Fomento"
    - "BPF"
    - "IFD"
    - "Instituição Financeira de Desenvolvimento"
    - "RFAI"
    - "SIFIDE"
    - "DLRR"
    - "CFEI"
    - "fundo perdido"
    - "fundo a fundo perdido"
    - "subvenção em Portugal"
    - "incentivo IAPMEI"
    - "candidatura PT 2030"
    - "aviso de candidatura"
    - "auxílio de Estado"
    - "linha BPF"
    - "majoração"
    - "tax planning Portugal"
  trigger_context:
    - usuário explicitamente menciona "vou aplicar a fundo perdido em Portugal"
    - usuário menciona "candidatura ao PRR"
  action: |
    Gerar sumário de pré-handoff e rotear para /capital-chief.
    NÃO tentar fazer o trabalho do capital-squad dentro do business-plan-squad.

