  vault_clones_base: "{{VAULT_PATH}}/CLONES/"
  clones:
    pedro-siza-vieira:
      vault_path: "{{VAULT_PATH}}/CLONES/pedro-siza-vieira/"
      core_files:
        - pedro-siza-vieira_06_KNOWLEDGE_COMPLETE.md
