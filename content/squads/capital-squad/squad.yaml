output_base_dir: "{{PROJECT_PATH}}/squads/capital-squad/output"

context_loading:
  required_before_any_action:
    - "{{CLAUDE_PROJECT_MEMORY_PATH}}/MEMORY.md"
    - "{{HOME}}/CLAUDE.md"
  recommended:
    - "{{PROJECT_PATH}}/CLAUDE.md"
    - "{{VAULT_PATH}}/_memory/"

quality_gates:
  discovery_completion: "Capital Chief não pode rotear sem completar os 6 blocos de discovery (50 perguntas)"
  routing_validation: "Cada output de especialista deve ser validado pelo Capital Chief antes de avançar"
  final_consolidation: "Output final deve passar por revisão de coerência entre os 7 especialistas"
