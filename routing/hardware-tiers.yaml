# ============================================================================
#  infinity-os - tiers de hardware -> modelos locais recomendados (Ollama)
#  Usado pelo passo 20-models.sh (model-advisor) para recomendar o que baixar.
#  O instalador detecta RAM/GPU e cruza com estes tiers.
# ============================================================================
#
#  A escolha NAO e so por RAM: o instalador mede RAM livre, memoria de video
#  (VRAM ou unificada) e ESPACO LIVRE EM DISCO de verdade, e recomenda a
#  maior opcao desta escada que caiba com folga no menor dos dois limites.
#
#  size_gb = tamanho real de download/memoria em disco (quantizacao padrao
#  Q4_K_M do Ollama, conferido em ollama.com/library em 2026-08). Regra geral
#  de bolso: cerca de 0,6 GB por bilhao de parametros. O valor real medido
#  fica um pouco acima disso; use o size_gb da tabela, nao so a regra de
#  bolso, para decidir.
# ============================================================================

model_ladder:
  - tag: "qwen3-coder:30b"
    params_b: 30
    size_gb: 19.0
    note: "Sweet spot para codigo. MoE (so ~3.3B ativos por token, roda rapido mesmo pesando 30B)."

  - tag: "qwen2.5-coder:14b"
    params_b: 14
    size_gb: 9.0
    note: "Bom equilibrio qualidade/custo para maquinas medianas."

  - tag: "qwen2.5-coder:7b"
    params_b: 7
    size_gb: 4.7
    note: "Roda bem em notebooks com 16 GB de RAM."

  - tag: "qwen2.5-coder:3b"
    params_b: 3
    size_gb: 1.9
    note: "Leve, ainda util para tarefas simples de codigo."

  - tag: "qwen2.5-coder:1.5b"
    params_b: 1.5
    size_gb: 1.0
    note: "So pra maquina muito limitada, qualidade bem reduzida."

  - tag: "qwen2.5-coder:0.5b"
    params_b: 0.5
    size_gb: 0.5
    note: "Ultimo degrau da escada. Se nem isso couber, use nuvem."

# Regra de decisao (espelhada em 20-models.sh):
# 1. memoria_disponivel_gb = RAM_total_gb - 8 (reserva pro sistema); se
#    houver GPU NVIDIA dedicada com VRAM maior que essa sobra, usa a VRAM.
# 2. disco_disponivel_gb = espaco livre em $HOME - 2 GB de margem.
# 3. limite_gb = min(memoria_disponivel_gb, disco_disponivel_gb).
# 4. Recomenda a maior linha do model_ladder cujo size_gb <= limite_gb.
# 5. Se nenhuma couber, nao instala modelo local: o roteador usa nuvem
#    (Claude/Gemini), que e o caminho normal e nao um erro.
sizing_rule:
  ram_reserve_gb: 8
  disk_margin_gb: 2
  bytes_per_billion_params_gb: 0.6   # regra de bolso; size_gb medido tem prioridade
